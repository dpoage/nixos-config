version: 2
updates:
  # Pull requests are disabled here: updates arrive as dependabot/** branches
  # that .github/workflows/check.yml checks and fast-forwards into main. Daily
  # so dpoage/omp-flake's self-bumps land promptly; omp-flake stays ungrouped
  # in its own branch, and the groups keep the rest to two branches.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
    ignore:
      # Private git+ssh input; Dependabot has no credentials for it.
      - dependency-name: pattern-cli
    groups:
      # Release-branch inputs that must move together.
      nixos-release:
        patterns: [nixpkgs, home-manager, nixvim]
      flake-inputs:
        patterns: ["*"]
        exclude-patterns: [omp-flake]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
