# Pull requests are disabled on this repo, so Dependabot's updates arrive as
# dependabot/** branch pushes. Both checks run on them; the merge job then
# fast-forwards main to the branch.
name: Check

on:
  push:
    branches: [main, "dependabot/**"]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [oerlikon, tunguska]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      # pattern-cli is a private git+ssh input; swap in an empty stub so the
      # hosts evaluate without credentials. Evaluation warnings (deprecations,
      # renamed options) are surfaced as annotations rather than failures.
      - name: Evaluate ${{ matrix.host }}
        run: |
          status=0
          nix eval --raw \
            --option allow-import-from-derivation false \
            --override-input pattern-cli path:./ci/pattern-cli-stub \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" \
            2>eval.log || status=$?
          cat eval.log >&2
          grep -h 'evaluation warning:' eval.log | sed 's/^/::warning title=${{ matrix.host }}::/' || true
          exit "$status"

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      # Flake-input packages not served by cache.nixos.org.
      - name: Build beads and omp
        run: |
          nix build --print-build-logs \
            --override-input pattern-cli path:./ci/pattern-cli-stub \
            .#nixosConfigurations.tunguska.pkgs.beads \
            .#nixosConfigurations.tunguska.pkgs.omp

  merge:
    needs: [eval, packages]
    if: startsWith(github.ref, 'refs/heads/dependabot/') && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Dependabot-triggered runs get a read-only token unless raised here.
    permissions:
      contents: write
    # One merge at a time: every update touches flake.lock, so only the first
    # of a batch can fast-forward. The rest stay unmerged until Dependabot's
    # next daily run recreates them on top of the new main.
    concurrency: dependabot-merge
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fast-forward main
        run: |
          if gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/main" \
               -f sha="${{ github.sha }}" -F force=false >/dev/null; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}"
          else
            echo "::warning::main moved since ${{ github.ref_name }} was cut; Dependabot's next run will recreate it"
          fi
