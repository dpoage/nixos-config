# OMP settings overlay — loaded via PI_CONFIG_FILES (see common/home/dotfiles.nix).
#
# This is the read-only overlay layer: it overrides the writable global
# ~/.omp/agent/config.yml per-key, so ONLY the keys set here are pinned.
# /model Roles-view and /settings edits to these keys will NOT take effect
# while the overlay is active — edit this file (and rebuild) instead. Project
# .omp/config.yml may still define additional roles (e.g. MUSICIAN).
#
# Role contract (oracle-rounds / arbiter-architect skills):
#   ORACLE      — strongest available; false APPROVE is silent
#   AUGUR       — oracle-class, different model family from ORACLE; writes the
#                 fixes ORACLE re-reviews, so reviewer and fixer never share blind spots
#   ARCHITECT   — strong; failures are visible at arbiter checkpoints
#   IMPLEMENTER — mid-tier; brief quality substitutes for model strength
#   PRESCREEN   — cheap; reject-only on reproduced command failures, never approves
#
# Fallbacks (retry.fallbackChains) engage only when the primary keeps failing
# (429s, quota walls, outages); bare entries inherit the failing turn's effort.
# AUGUR falls back to the ORACLE model, which suspends the cross-family
# guarantee for the fix rounds that run on it.
#
# Thinking levels are fixed, not `auto`: auto resolved to xhigh on ~70% of
# turns and providers.autoThinkingMaxEffort cannot go below xhigh. GLM-5.3's
# ladder is low/high/max (no medium), so its roles pin high.
modelRoles:
  ORACLE: anthropic/claude-opus-5-5:high
  AUGUR: zai/glm-5.3:high
  ARCHITECT: anthropic/claude-opus-5-5:medium
  IMPLEMENTER: zai/glm-5.3:high
  # Reject-only pre-screen: never approves, so a cheap model is safe. MiniMax has
  # idle quota; GLM is the fallback because its quota already runs out.
  PRESCREEN: minimax-code/MiniMax-M3:high
  # Fan-out sweepers an oracle spawns per unit x bug family; leads only, the
  # oracle re-runs every candidate. High fan-out, so the cheapest capable model.
  SWEEP: minimax-code/MiniMax-M3:medium

# Main-session default; raise per session with /thinking when a task needs it.
defaultThinkingLevel: medium

retry:
  fallbackChains:
    AUGUR:
      - anthropic/claude-opus-5-5
    IMPLEMENTER:
      - anthropic/claude-sonnet-5-5
    PRESCREEN:
      - zai/glm-5.3
    SWEEP: []

# Soft per-subagent request budget; force-stop at 1.5x. The default 200/300
# is too low for architects, which run a whole round. omp has no per-agent
# override (scout/sonic stay capped at 100 internally), so this is global.
task:
  softRequestBudget: 600
  # arbiter (0) -> architect (1) -> oracle (2) -> sweeper (3): the default cap of 2
  # strips `task` from oracles under an architect, so they could not spawn sweepers.
  maxRecursionDepth: 3
