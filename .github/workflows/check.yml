name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [oerlikon, tunguska]
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # pattern-cli is a private git+ssh input; swap in an empty stub so the
      # hosts evaluate without credentials. Evaluation warnings (deprecations,
      # renamed options) are surfaced as annotations rather than failures.
      - name: Evaluate ${{ matrix.host }}
        run: |
          status=0
          nix eval --raw \
            --option allow-import-from-derivation false \
            --override-input pattern-cli path:./ci/pattern-cli-stub \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" \
            2>eval.log || status=$?
          cat eval.log >&2
          grep -h 'evaluation warning:' eval.log | sed 's/^/::warning title=${{ matrix.host }}::/' || true
          exit "$status"

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # Flake-input packages not served by cache.nixos.org.
      - name: Build beads and omp
        run: |
          nix build --print-build-logs \
            --override-input pattern-cli path:./ci/pattern-cli-stub \
            .#nixosConfigurations.tunguska.pkgs.beads \
            .#nixosConfigurations.tunguska.pkgs.omp
